name: Feature request
description: Suggest an improvement or a new capability.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues first to avoid duplicates.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what makes it difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like Chord to handle it?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other tools or workarounds you have tried.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Recording
        - Editing
        - Transcription
        - Noise reduction
        - Camera background removal
        - Exporting
        - Settings
        - Other
    validations:
      required: true

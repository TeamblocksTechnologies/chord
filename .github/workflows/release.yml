name: Release

# Pushing a `v*` tag builds the signed, notarized arm64 app from that commit and drafts a GitHub release with the
# downloads. Publishing the draft is a manual step, and only published releases reach the in-app updater.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and draft the release
    runs-on: macos-26
    timeout-minutes: 60
    # Holds the signing and notarization secrets; restrict its deployments to `v*` tags.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches every version number
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          test "$(node -p 'require("./apps/desktop/package.json").version')" = "$VERSION"
          for plist in native/macos/Resources/Info.plist native/macos/Resources/transcriber-helper-Info.plist; do
            test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "$VERSION"
            test "$(plutil -extract CFBundleVersion raw "$plist")" = "$VERSION"
          done
      - name: Select the pinned Xcode toolchain
        run: |
          XCODE_VERSION="$(cat .xcode-version)"
          sudo xcode-select --switch "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version
          swift --version
      - name: Import the Developer ID certificate
        id: signing
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          echo "$CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # macOS's bash 3.2 has no mapfile.
          KEYCHAINS=()
          while IFS= read -r keychain; do KEYCHAINS+=("$keychain"); done \
            < <(security list-keychains -d user | sed -e 's/^ *"//' -e 's/"$//')
          security list-keychains -d user -s "$KEYCHAIN" "${KEYCHAINS[@]}"
          rm "$RUNNER_TEMP/certificate.p12"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)"
          test -n "$IDENTITY"
          echo "identity=$IDENTITY" >>"$GITHUB_OUTPUT"
      # Built from scratch rather than from CI's caches, so everything shipped comes from this commit.
      - name: Build and sign the native helpers using locked dependencies
        env:
          SIGN_IDENTITY: ${{ steps.signing.outputs.identity }}
        run: |
          swift build --package-path native/macos -c release --force-resolved-versions
          native/macos/scripts/build.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - name: Check pinned pnpm and dependency graph compatibility
        run: pnpm check:package-manager
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the Electron application
        run: pnpm build
      - name: Package, sign and notarize the application
        working-directory: apps/desktop
        env:
          CSC_NAME: ${{ steps.signing.outputs.identity }}
          APPLE_API_KEY_CONTENTS: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_CONTENTS" >"$APPLE_API_KEY"
          pnpm exec electron-builder --mac --arm64 --publish never
      - name: Check Gatekeeper accepts the notarized application
        working-directory: apps/desktop/dist
        run: |
          codesign --verify --deep --strict --verbose=2 mac-arm64/Chord.app
          xcrun stapler validate mac-arm64/Chord.app
          spctl --assess --type execute --verbose=2 mac-arm64/Chord.app
      - name: Attest the downloads were built from this commit
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            apps/desktop/dist/Chord-*.dmg
            apps/desktop/dist/Chord-*.zip
            apps/desktop/dist/latest-mac.yml
      - name: Draft the release
        working-directory: apps/desktop/dist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --verify-tag --title "Chord ${TAG#v}" --generate-notes \
            Chord-*.dmg Chord-*.dmg.blockmap Chord-*.zip Chord-*.zip.blockmap latest-mac.yml
      - name: Remove the signing keychain and notarization key
        if: ${{ always() }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/AuthKey.p8"

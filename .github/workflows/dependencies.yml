name: Dependency security

on:
  pull_request:
  push:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # On pull requests, the merge commit and its first parent, the base branch tip.
          fetch-depth: 2
          persist-credentials: false
      # Pull requests that leave dependencies alone skip the audit. Every other run, including the
      # weekly schedule that catches newly published advisories, audits in full.
      - name: Check whether dependencies changed
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] ||
            ! git diff --quiet HEAD^1 HEAD -- '*package.json' pnpm-lock.yaml pnpm-workspace.yaml \
              .node-version scripts/check-package-manager.mjs .github/workflows/dependencies.yml; then
            echo "audit=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: ${{ steps.changes.outputs.audit == 'true' }}
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: ${{ steps.changes.outputs.audit == 'true' }}
      - name: Check pinned pnpm and dependency graph compatibility
        if: ${{ steps.changes.outputs.audit == 'true' }}
        run: pnpm check:package-manager
      - name: Install locked dependencies
        if: ${{ steps.changes.outputs.audit == 'true' }}
        run: pnpm install --frozen-lockfile
      - name: Audit all dependencies, including development tools and Electron
        if: ${{ steps.changes.outputs.audit == 'true' }}
        run: pnpm audit:dependencies
